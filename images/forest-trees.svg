<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <rect width="400" height="200" fill="#e0f2fe"/>
  
  <!-- Ground -->
  <rect y="200" width="400" height="100" fill="#86efac"/>
  
  <!-- Background distant trees (lighter) -->
  <path d="M 50 200 L 70 140 L 90 200 Z" fill="#4ade80" opacity="0.6"/>
  <path d="M 150 200 L 170 130 L 190 200 Z" fill="#4ade80" opacity="0.6"/>
  <path d="M 280 200 L 300 140 L 320 200 Z" fill="#4ade80" opacity="0.6"/>
  
  <!-- Tree trunks -->
  <rect x="45" y="190" width="10" height="50" fill="#8b4513"/>
  <rect x="165" y="185" width="12" height="55" fill="#8b4513"/>
  <rect x="285" y="188" width="11" height="52" fill="#8b4513"/>
  
  <!-- Front left tree (pine/spruce) -->
  <path d="M 50 190 L 30 130 L 70 190 Z" fill="#15803d"/>
  <path d="M 50 160 L 25 100 L 75 160 Z" fill="#22c55e"/>
  <path d="M 50 130 L 35 80 L 65 130 Z" fill="#15803d"/>
  
  <!-- Front center tree (larger) -->
  <path d="M 170 185 L 140 110 L 200 185 Z" fill="#15803d"/>
  <path d="M 170 155 L 130 60 L 210 155 Z" fill="#22c55e"/>
  <path d="M 170 120 L 145 45 L 195 120 Z" fill="#15803d"/>
  <circle cx="170" cy="65" r="8" fill="#059669"/>
  
  <!-- Front right tree (oak-like) -->
  <path d="M 290 188 L 265 120 L 315 188 Z" fill="#15803d"/>
  <ellipse cx="290" cy="140" rx="35" ry="50" fill="#22c55e"/>
  <ellipse cx="290" cy="100" rx="28" ry="40" fill="#15803d"/>
  
  <!-- Small shrubs/trees on ground -->
  <circle cx="100" cy="235" r="15" fill="#4ade80"/>
  <circle cx="250" cy="240" r="12" fill="#4ade80"/>
  <circle cx="350" cy="245" r="10" fill="#4ade80"/>
  
  <!-- Sun/light -->
  <circle cx="350" cy="30" r="25" fill="#fbbf24" opacity="0.8"/>
  
  <!-- Clouds -->
  <ellipse cx="80" cy="50" rx="35" ry="20" fill="white" opacity="0.7"/>
  <ellipse cx="300" cy="60" rx="40" ry="22" fill="white" opacity="0.6"/>
  
  <!-- Forest atmosphere overlay (subtle) -->
  <text x="200" y="280" font-size="12" fill="#059669" text-anchor="middle" font-family="Arial" font-weight="bold">Sustainable Forest Management</text>
</svg>